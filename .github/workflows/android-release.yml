name: OracleRPG + Chatpixel Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chatpixel-oracle-apk
  cancel-in-progress: false
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Importer test sources
        run: |
          git clone --depth 1 https://github.com/etiagoabreu/daggerheart-translation-pt-BR.git ../daggerheart-translation-pt-BR
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Foundryborne/daggerheart.git ../daggerheart-foundryborne
          git -C ../daggerheart-foundryborne sparse-checkout set src/packs/domains
      - run: npm test
      - run: npm run test:pixel
      - run: npm run lint
      - run: git restore lib/compendium/daggerheart.generated.json
      - run: npm run build:android
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-integrated-ui.mjs
      - run: node scripts/preview-pixel-art.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Sign and build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.CHATPIXEL_ANDROID_KEYSTORE }}
          ORACLE_VERSION_NAME: '0.6.3'
          ORACLE_VERSION_CODE: '600003'
          ORACLE_KEYSTORE_PASSWORD: android
          ORACLE_KEY_ALIAS: chatpixel
          ORACLE_KEY_PASSWORD: android
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chatpixel.jks"
          export ORACLE_KEYSTORE_PATH="$RUNNER_TEMP/chatpixel.jks"
          gradle -p android lintRelease assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          python scripts/verify-apk-assets.py android/app/build/outputs/apk/release/app-release.apk
          CHATPIXEL_WEB_ROOT=test-results/apk-web node scripts/verify-integrated-ui.mjs
          cp android/app/build/outputs/apk/release/app-release.apk test-results/Chatpixel-OracleRPG-0.6.3.apk
          cd test-results
          sha256sum Chatpixel-OracleRPG-0.6.3.apk > Chatpixel-OracleRPG-0.6.3.apk.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatpixel-oracle-integrated
          path: |
            test-results/
            android/app/build/reports/
      - name: Publish integrated APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view mobile-v0.6.3 >/dev/null 2>&1; then
            gh release create mobile-v0.6.3 --target "$GITHUB_SHA" --title 'Chatpixel + OracleRPG 0.6.3' --prerelease --notes 'Cópia do OracleRPG com Chatpixel no painel da cena, controlado pelo chat da sessão. Interface incluída no APK, login ChatGPT da sessão e estado visual salvo por campanha.'
          fi
          gh release upload mobile-v0.6.3 test-results/Chatpixel-OracleRPG-0.6.3.apk test-results/Chatpixel-OracleRPG-0.6.3.apk.sha256 test-results/chatpixel-oracle-desktop.png test-results/chatpixel-oracle-mobile.png test-results/chatpixel-art-gallery.png --clobber
